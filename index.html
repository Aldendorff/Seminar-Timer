<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seminar-Gruppenarbeit</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f7f9; --card:#ffffff; --text:#17202a; --muted:#667085; --accent:#1f6feb; --ok:#17803d; --warn:#9a6700; --border:#d0d7de; }
    @media (prefers-color-scheme: dark){ :root{ --bg:#0d1117; --card:#161b22; --text:#f0f6fc; --muted:#9da7b3; --border:#30363d; } }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    main{max-width:760px;margin:0 auto;padding:24px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;margin:18px 0}
    h1{font-size:clamp(1.8rem,5vw,3rem);margin:.2rem 0 1rem}
    .eyebrow{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem}
    .status{display:inline-block;padding:8px 12px;border-radius:999px;background:#e7f6ec;color:#176b35;font-weight:700}
    .time{font-size:clamp(3rem,12vw,7rem);font-weight:800;line-height:1;margin:20px 0 10px;font-variant-numeric:tabular-nums}
    .msg{font-size:1.15rem;margin-top:14px}
    .muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    button,input{font:inherit}
    button{min-height:48px;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:white;font-weight:700;cursor:pointer}
    button.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
    button.danger{background:#b42318}
    input{width:100%;min-height:48px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--text)}
    label{display:block;font-weight:650;margin:14px 0 6px}
    .hidden{display:none !important}
    .error{color:#b42318;font-weight:650}
    .success{color:var(--ok);font-weight:650}
    footer{font-size:.9rem;color:var(--muted);margin-top:28px;text-align:center}
  </style>
</head>
<body>
<main>
  <section class="card" id="viewer">
    <div class="eyebrow">Gruppenarbeit</div>
    <h1 id="headline">Bitte später zurückkehren</h1>
    <span class="status" id="statusBadge">läuft</span>
    <div class="time" id="returnTime">--:--</div>
    <div class="msg" id="message">Aktuelle Rückkehrzeit wird geladen …</div>
    <p class="muted" id="updated">Stand: –</p>
  </section>

  <section class="card hidden" id="adminCard">
    <div class="eyebrow">Lehrenden-Ansicht</div>
    <h2>Steuerung</h2>
    <div id="loginBox">
      <label for="email">E-Mail</label><input id="email" type="email" autocomplete="username" />
      <label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" />
      <button id="loginBtn" style="margin-top:14px;width:100%">Anmelden</button>
      <p class="muted">Nur nötig, wenn du die Zeit verändern möchtest.</p>
    </div>

    <div id="controls" class="hidden">
      <div class="grid">
        <button data-min="5">+5 Min</button>
        <button data-min="10">+10 Min</button>
        <button class="secondary" data-min="-5">−5 Min</button>
        <button class="secondary" id="setNowBtn">Jetzt +20 Min</button>
      </div>
      <label for="manualTime">Rückkehrzeit manuell setzen</label>
      <input id="manualTime" type="time" />
      <button id="setManualBtn" style="margin-top:10px;width:100%">Rückkehrzeit übernehmen</button>

      <label for="adminMessage">Hinweis</label>
      <input id="adminMessage" maxlength="140" placeholder="z. B. Bitte Ergebnisse mitbringen" />
      <button id="setMessageBtn" style="margin-top:10px;width:100%">Hinweis aktualisieren</button>

      <div class="grid" style="margin-top:14px">
        <button id="resumeBtn">Gruppenarbeit läuft</button>
        <button class="danger" id="endBtn">Gruppenarbeit beenden</button>
      </div>
      <button class="secondary" id="logoutBtn" style="margin-top:14px;width:100%">Abmelden</button>
      <p id="adminInfo" class="muted"></p>
    </div>
  </section>

  <footer>Diese Seite aktualisiert sich automatisch, solange sie geöffnet ist.</footer>
</main>

<script type="module">
  // 1) Trage hier die Firebase-Web-App-Konfiguration ein.
  // Du findest sie in Firebase: Projekteinstellungen > Deine Apps > Web-App > SDK setup and configuration.
  const firebaseConfig = {
    apiKey: "AIzaSyAMNBryf4qdNLiIrc2T-2oHcXYexG1jWSk",
    authDomain: "seminar-timer.firebaseapp.com",
    databaseURL: "https://seminar-timer-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "seminar-timer",
    storageBucket: "seminar-timer.firebasestorage.app",
    messagingSenderId: "353748281033",
    appId: "1:353748281033:web:f1db0c2ab7210fcf054f18"
  };

  // 2) Optional ändern, falls du mehrere Seminare getrennt verwalten möchtest.
  const ROOM_ID = "seminar-1";

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const roomRef = ref(db, `rooms/${ROOM_ID}`);

  const $ = (id) => document.getElementById(id);
  const adminMode = new URLSearchParams(location.search).get("admin") === "1";
  if (adminMode) $("adminCard").classList.remove("hidden");

  let state = { returnAt: null, message: "Bitte zur angegebenen Zeit zurückkehren.", active: true, updatedAt: null };

  function fmtTime(ms){
    if (!ms) return "--:--";
    return new Date(ms).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
  }
  function fmtUpdated(ms){
    if (!ms) return "–";
    return new Date(ms).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  }
  function render(){
    $("returnTime").textContent = fmtTime(state.returnAt);
    $("message").textContent = state.message || "";
    $("updated").textContent = `Stand: ${fmtUpdated(state.updatedAt)}`;
    $("statusBadge").textContent = state.active ? "läuft" : "beendet";
    $("headline").textContent = state.active ? "Rückkehr in den Seminarraum" : "Gruppenarbeit beendet";
    if (!state.active) $("returnTime").textContent = "Jetzt";
  }

  onValue(roomRef, (snap) => {
    if (snap.exists()) state = {...state, ...snap.val()};
    render();
  }, () => {
    $("message").textContent = "Keine Verbindung zur Live-Anzeige. Bitte Seite neu laden.";
  });

  async function patch(data){
    data.updatedAt = Date.now();
    await update(roomRef, data);
  }
  async function addMinutes(min){
    const base = state.returnAt && state.returnAt > Date.now()-12*60*60*1000 ? state.returnAt : Date.now();
    await patch({returnAt: base + min*60000, active:true});
  }

  document.querySelectorAll("[data-min]").forEach(btn => btn.addEventListener("click", () => addMinutes(Number(btn.dataset.min))));
  $("setNowBtn").addEventListener("click", () => patch({returnAt: Date.now()+20*60000, active:true}));
  $("setManualBtn").addEventListener("click", async () => {
    const val = $("manualTime").value;
    if (!val) return;
    const [h,m] = val.split(":").map(Number);
    const d = new Date(); d.setHours(h,m,0,0);
    if (d.getTime() < Date.now()-60*60*1000) d.setDate(d.getDate()+1);
    await patch({returnAt:d.getTime(), active:true});
  });
  $("setMessageBtn").addEventListener("click", () => patch({message:$("adminMessage").value.trim()}));
  $("resumeBtn").addEventListener("click", () => patch({active:true}));
  $("endBtn").addEventListener("click", () => patch({active:false, returnAt:Date.now(), message:"Bitte jetzt in den Seminarraum zurückkehren."}));

  $("loginBtn").addEventListener("click", async () => {
    $("adminInfo").textContent = "";
    try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value); }
    catch { $("adminInfo").textContent = "Anmeldung fehlgeschlagen."; $("adminInfo").className = "error"; }
  });
  $("logoutBtn").addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, user => {
    $("loginBox").classList.toggle("hidden", !!user);
    $("controls").classList.toggle("hidden", !user);
    if (user) {
      $("adminInfo").textContent = `Angemeldet als ${user.email}`;
      $("adminInfo").className = "success";
    }
  });

  render();
</script>
</body>
</html>
